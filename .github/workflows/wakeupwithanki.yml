name: Build WakeUpWithAnki

# Builds https://github.com/DroidThug/WakeUpWithAnki at a pinned commit for personal testing.
# The source is not copied into this repo; the APK is only kept as a workflow artifact.
on:
  push:
    branches: [wakeupwithanki]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WakeUpWithAnki
        uses: actions/checkout@v4
        with:
          repository: DroidThug/WakeUpWithAnki
          ref: d2d7537b6946541afe923ec6c8d96018401ee128

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME); setup-android fails there now.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.7
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" -A2 build.log | head -24 | paste -sd'\n' | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=Build log::{}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk wakeupwithanki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wakeupwithanki-apk
          path: wakeupwithanki.apk
          retention-days: 30
