name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      # Compiler errors become annotations, so they are visible on the run page
      # (and through the public API) without opening the full log.
      - name: Report errors
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          picked = []
          for i, l in enumerate(lines):
              if re.match(r"^(e: |.*error:|> |\* What went wrong|.*FAILED)", l) or "Could not" in l:
                  picked.append(l.strip())
          picked = picked[:60] or lines[-40:]
          for k in range(0, len(picked), 12):
              msg = "%0A".join(p.replace("%", "%25") for p in picked[k:k + 12])
              print(f"::error title=Build log {k // 12 + 1}::{msg}")
          EOF

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk my-alarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-alarm-apk
          path: my-alarm.apk

      # Releases come only from main; other branches get the APK as a run artifact.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: My Alarm English 0.1.${{ github.run_number }}
          body: "Сборка из ${{ github.sha }}. Скачай my-alarm.apk и установи на телефон."
          files: my-alarm.apk
          make_latest: true
